spring:
  application:
    name: GP

  datasource:
    url: jdbc:h2:mem:gpdb;
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
    datasource:
      driver-class-name: org.h2.Driver



  jpa:
    hibernate:
      ddl-auto: create-drop
      # 나중에 배포시 create-drop대신 update로 바꿔야함.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  # Spring Mail 설정 추가 (Gmail 기준)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}        # ← 본인 Gmail 주소
    password: ${MAIL_PASSWORD}        # ← Gmail 앱 비밀번호 (계정 -> 보안 -> 2단계 인증)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  # TODO scretKey: ${JWT_SCRET_KEY}
  secretKey: "asdfqwrt!@#QWEASDE#@ESAXc1241234"

  access:
    # 액세스 토큰 만료시간 1시간 : 1000(ms -> s) * 60 (s -> m) * 60(m -> h)
    expiration: 3600000
    header: Authorization

server:
  port: 8080

