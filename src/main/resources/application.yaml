spring:
  application:
    name: GP

  datasource:
    url: jdbc:h2:mem:gpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
    datasource:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:mem:gpdb;
      username: sa



  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: 8080
